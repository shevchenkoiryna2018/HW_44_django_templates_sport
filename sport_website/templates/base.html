<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Sport Hub</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body>

<!-- ==================== НАВІГАЦІЯ ==================== -->

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand fw-bold" href="{% url 'sport:index' %}">
            🏆 Sport Hub
        </a>

        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNav"
        >
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'sport:index' %}">
                        Головна
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'sport:football' %}">
                        ⚽ Футбол
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'sport:hockey' %}">
                        🏒 Хокей
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'sport:basketball' %}">
                        🏀 Баскетбол
                    </a>
                </li>

            </ul>

        </div>

    </div>

</nav>


<main>

    {% block content %} {% endblock %}

    <!-- ==================== ЗАКЛИКАЮЧИЙ БЛОК ==================== -->

    <section class="bg-primary text-white py-5">

        <div class="container text-center">

            <h2 class="fw-bold">
                Обирай свій спорт!
            </h2>

            <p class="lead">
                Футбол, хокей чи баскетбол —
                кожен вид спорту має свою особливу атмосферу.
            </p>

        </div>

    </section>

</main>


<!-- ==================== FOOTER ==================== -->

<footer class="bg-dark text-white text-center py-4">

    <div class="container">

        <h5 class="fw-bold">
            🏆 Sport Hub
        </h5>

        <p class="mb-1">
            Інформаційний спортивний сайт
        </p>

        <small class="text-secondary">
            Футбол • Хокей • Баскетбол
        </small>

    </div>

</footer>


<!-- Bootstrap JavaScript -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>
